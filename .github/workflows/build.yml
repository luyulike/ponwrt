name: Build PonWrt XG‑040G‑MD‑UBI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu‑22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare build env
        uses: openwrt/actions‑setup‑buildenv@v1

      - name: Feeds update & install
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load device config XG‑040G‑MD‑UBI
        run: |
          cp configs/airoha_an7581_xg040g‑md‑ubi .config
          make defconfig

      - name: Download source code
        run: make download -j$(nproc)

      - name: Compile firmware
        run: make V=s -j$(nproc)

      - name: Upload firmware artifact
        uses: actions/upload‑artifact@v4
        with:
          name: PonWrt‑XG040G‑MD‑UBI‑bin
          path: bin/targets/airoha/an7581/*.bin
          retention‑days: 7
